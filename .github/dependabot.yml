# ==============================================================================
# Dependabot Configuration: Mis Seguros
# Automated dependency updates for Gradle and GitHub Actions
# ==============================================================================
version: 2
updates:
  # ----------------------------------------------------------------------------
  # Gradle Dependencies & Plugins (Root Monorepo & Version Catalog)
  # ----------------------------------------------------------------------------
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Santiago"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "gradle"
      - "kotlin"
    groups:
      kotlin-ecosystem:
        applies-to: "version-updates"
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
      compose-multiplatform:
        applies-to: "version-updates"
        patterns:
          - "org.jetbrains.compose*"
      ktor-ecosystem:
        applies-to: "version-updates"
        patterns:
          - "io.ktor*"
      android-support:
        applies-to: "version-updates"
        patterns:
          - "androidx.*"
          - "com.android.*"

  # ----------------------------------------------------------------------------
  # GitHub Actions Workflows (CI/CD)
  # ----------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "ci"
      - "dependencies"
